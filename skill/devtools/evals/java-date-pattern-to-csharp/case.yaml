name: java-date-pattern-to-csharp
expected_outcome: |
  The answer comes from DevTools datetime__convert (java-to-csharp). It gives the C# pattern yyyy-MM-dd'T'HH:mm:ss.fffzzz and says that XXX does not map exactly: at a UTC offset Java writes Z while C# zzz writes +00:00, so UTC timestamps will not match unless handled.
