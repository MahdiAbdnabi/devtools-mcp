schema_version: "1.1"
name: csv-products-to-csharp-records
expected_outcome: |
  Product.cs holds a C# record named Product in namespace Shop.Catalog, generated by DevTools by chaining tabular__csv-to-json (with type inference) and codegen__json-to-csharp. It has one member for each of the five CSV columns, maps each member to its column name for System.Text.Json, types in_stock as bool and reorder_level as an integer type, and keeps sku and name as strings.
context:
